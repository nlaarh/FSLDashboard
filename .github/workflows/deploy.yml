name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: fslapp-nyaaa
  NODE_VERSION: '20'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build React frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Copy frontend build to backend
      run: |
        cp backend/static/track.html /tmp/track.html
        cp backend/static/track_demo.html /tmp/track_demo.html
        rm -rf backend/static
        cp -r frontend/dist backend/static
        cp /tmp/track.html backend/static/track.html
        cp /tmp/track_demo.html backend/static/track_demo.html

    - name: Create deployment package
      working-directory: backend
      run: |
        # All Python source + config + static assets
        # Azure Oryx will pip install from requirements.txt server-side
        zip -r ../deploy.zip \
          *.py \
          routers/ \
          repositories/ \
          salesforce_queries/ \
          startup.sh requirements.txt \
          static/
        echo "Package size: $(du -h ../deploy.zip | cut -f1)"
        echo "Files included:"
        unzip -l ../deploy.zip | grep "\.py$" | awk '{print $4}'

    - name: Sign in to Azure (OIDC, no stored password)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy ZIP to Azure (Oryx builds on the server)
      run: |
        az webapp deploy \
          --resource-group rg-nlaaroubi-sbx-eus2-001 \
          --name "${{ env.AZURE_WEBAPP_NAME }}" \
          --src-path deploy.zip --type zip --timeout 900000

    - name: Verify the app is healthy
      run: |
        # The app restarts after the build: wait for a healthy answer (up to 3 minutes)
        SITE="https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        for i in $(seq 1 18); do
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$SITE/api/health" || true)
          echo "Health check $i: HTTP $CODE"
          if [ "$CODE" = "200" ]; then echo "App is live."; exit 0; fi
          sleep 10
        done
        echo "App did not become healthy after the build"; exit 1
